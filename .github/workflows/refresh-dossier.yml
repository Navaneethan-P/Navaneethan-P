name: Refresh engineering dossier

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-engineering-dossier
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Refresh dossier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_dossier.py
      - name: Commit generated updates when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/signal.gif
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh engineering dossier"
            git push
          fi
